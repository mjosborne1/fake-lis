<div class="order-panel report-container">
    {% if error %}
    <div class="orders-header">
        <h3>Token not created</h3>
        <span class="badge status-revoked">Error</span>
    </div>
    <p>{{ error }}</p>
    {% else %}
    <div class="orders-header">
        <h3>Token for {{ email }}</h3>
        <span class="badge status-active">Created</span>
    </div>
    <p>Copy this token now and send it to {{ email }}. It will not be shown again.</p>
    <pre class="code-block">{{ token }}</pre>
    <button type="button" class="btn btn-sm btn-secondary"
            onclick="navigator.clipboard.writeText(this.previousElementSibling.textContent); this.textContent = 'Copied'">Copy</button>
    {% endif %}
</div>
